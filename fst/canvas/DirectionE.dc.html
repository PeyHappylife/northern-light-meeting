<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1E3A5F; } a:hover { color: #142743; }
  </style>
</helmet>
<div style="width: 1280px; height: 800px; background: #FCFCFA; color: #16202C; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; display: flex; flex-direction: column; box-sizing: border-box">

  <div style="background: #1E3A5F; color: #FCFCFA; padding: 34px 72px; display: flex; align-items: baseline; justify-content: space-between">
    <span style="font-family: 'Shippori Mincho', serif; font-weight: 700; font-size: 30px; letter-spacing: 0.06em">第一章　目的を決める</span>
    <span style="font-family: 'Shippori Mincho', serif; font-size: 17px; letter-spacing: 0.2em; color: #C8A24A">STEP 01</span>
  </div>
  <div style="height: 4px; background: #C8A24A"></div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 64px; align-items: start; padding: 56px 72px; flex-grow: 1">

    <div style="display: flex; flex-direction: column; gap: 28px">
      <p style="font-family: 'Shippori Mincho', serif; font-weight: 700; font-size: 34px; line-height: 1.7; margin: 0; word-break: keep-all">「なんのため？」を、紙に一行で書く。</p>
      <div style="height: 1px; background: #D3D8DE"></div>
      <div style="display: flex; flex-direction: column; gap: 18px">
        <div style="display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 16px; align-items: baseline">
          <span style="font-family: 'Shippori Mincho', serif; font-size: 22px; color: #C8A24A">一</span>
          <p style="font-size: 19px; line-height: 1.9; margin: 0">目的は、金額でも時間でも、会いたい人の名前でもよい。</p>
        </div>
        <div style="display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 16px; align-items: baseline">
          <span style="font-family: 'Shippori Mincho', serif; font-size: 22px; color: #C8A24A">二</span>
          <p style="font-size: 19px; line-height: 1.9; margin: 0">かならず「いつまでに」を並べて書く。</p>
        </div>
        <div style="display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 16px; align-items: baseline">
          <span style="font-family: 'Shippori Mincho', serif; font-size: 22px; color: #C8A24A">三</span>
          <p style="font-size: 19px; line-height: 1.9; margin: 0">毎日目に入るところへ貼る。</p>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px; border: 1px solid #D3D8DE; padding: 24px; background: #FFFFFF">
      <svg viewBox="0 0 280 240" role="img" aria-label="的の中心に矢が届いた図" style="display: block; width: 100%; height: auto">
        <circle cx="122" cy="120" r="92" fill="none" stroke="#16202C" stroke-width="1.6"/>
        <circle cx="122" cy="120" r="58" fill="none" stroke="#16202C" stroke-width="1.6"/>
        <circle cx="122" cy="120" r="26" fill="#1E3A5F"/>
        <line x1="266" y1="226" x2="140" y2="136" stroke="#C8A24A" stroke-width="3"/>
        <polygon points="142,134 120,120 132,142" fill="#C8A24A"/>
      </svg>
      <p style="font-family: 'Shippori Mincho', serif; font-size: 16px; line-height: 1.9; color: #4A5563; margin: 0">的＝目的。矢＝期限。<br>どちらが欠けても放てない。</p>
    </div>

  </div>

  <div style="padding: 20px 72px; border-top: 1px solid #D3D8DE; font-size: 15px; letter-spacing: 0.1em; color: #6B7480">ファーストステップ・トレーニング　04 / 13</div>
</div>
</x-dc>
</body>
</html>
