<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #A8452E; } a:hover { color: #7E3322; }
  </style>
</helmet>
<div style="width: 1280px; height: 800px; background: #F5F1E8; color: #221E1A; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; display: flex; flex-direction: column; padding: 84px 96px 64px; box-sizing: border-box; position: relative">

  <div style="display: flex; align-items: baseline; gap: 20px; margin-bottom: 56px">
    <span style="font-family: 'Zen Old Mincho', serif; font-size: 15px; letter-spacing: 0.34em; color: #8A7B5F">FIRST STEP</span>
    <span style="flex-grow: 1; height: 1px; background: #D8CFBC"></span>
    <span style="font-family: 'Zen Old Mincho', serif; font-size: 15px; letter-spacing: 0.2em; color: #8A7B5F">04 / 13</span>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 72px; align-items: start; flex-grow: 1">
    <div style="display: flex; flex-direction: column; gap: 30px">
      <div style="display: flex; align-items: baseline; gap: 14px">
        <span style="font-family: 'Zen Old Mincho', serif; font-size: 46px; line-height: 1; color: #A8452E">一</span>
        <span style="font-size: 17px; letter-spacing: 0.16em; color: #8A7B5F">はじめの一歩</span>
      </div>
      <h1 style="font-family: 'Zen Old Mincho', serif; font-weight: 700; font-size: 62px; line-height: 1.32; letter-spacing: 0.02em; margin: 0">目的を決める</h1>
      <p style="font-size: 27px; line-height: 1.8; font-weight: 500; margin: 0; word-break: keep-all">「なんのため？」を、<br>紙に一行だけ書く。</p>
      <p style="font-size: 19px; line-height: 2; color: #5E574C; margin: 0; max-width: 30em">金額でも、時間でも、会いたい人の名前でもかまいません。大事なのは「いつまでに」を並べて書くこと。</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px; padding-top: 24px">
      <svg viewBox="0 0 300 300" role="img" aria-label="的の中心に矢が届き、期限の札が添えられている図" style="width: 100%; height: auto">
        <circle cx="150" cy="150" r="118" fill="none" stroke="#D8CFBC" stroke-width="1.5"/>
        <circle cx="150" cy="150" r="78" fill="none" stroke="#D8CFBC" stroke-width="1.5"/>
        <circle cx="150" cy="150" r="38" fill="#A8452E"/>
        <line x1="292" y1="286" x2="168" y2="168" stroke="#221E1A" stroke-width="2.5"/>
        <polygon points="170,166 148,150 160,174" fill="#221E1A"/>
      </svg>
      <p style="font-family: 'Zen Old Mincho', serif; font-size: 16px; line-height: 1.9; color: #8A7B5F; margin: 0; text-align: center">的と期限。<br>どちらが欠けても、矢は放てない。</p>
    </div>
  </div>

  <p style="font-size: 15px; letter-spacing: 0.1em; color: #A79A82; margin: 0">ファーストステップ・トレーニング</p>
</div>
</x-dc>
</body>
</html>
