<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2C6B45; } a:hover { color: #1E4C31; }
  </style>
</helmet>
<div style="width: 1280px; height: 800px; background: #EDF1EA; color: #14201A; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; display: flex; align-items: center; padding: 72px 88px; box-sizing: border-box">
  <div style="display: grid; grid-template-columns: minmax(0, 0.92fr) minmax(0, 1fr); gap: 64px; align-items: center; width: 100%">

    <div style="display: flex; flex-direction: column; gap: 20px">
      <p style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.2em; color: #5A6A5E; margin: 0"><span style="font-size: 30px; color: #2C6B45; letter-spacing: 0">01</span> STEP</p>
      <h1 style="font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 700; font-size: 50px; line-height: 1.35; margin: 0">目的を決める</h1>
      <p style="font-size: 26px; line-height: 1.75; font-weight: 500; margin: 0; word-break: keep-all">「なんのため？」を、紙に<span style="color: #2C6B45; font-weight: 700">1行</span>で書く。</p>
      <p style="font-size: 19px; line-height: 1.95; color: #5A6A5E; margin: 0; max-width: 30em">金額でも、時間でも、人の名前でもかまいません。大事なのは、いつまでに、を一緒に書くこと。目的が決まると、今日やることが決まります。</p>
    </div>

    <figure style="display: flex; flex-direction: column; gap: 14px; margin: 0; min-width: 0">
      <svg viewBox="0 0 440 300" role="img" aria-label="的の中心に矢が刺さり、期限の札がつく図" style="display: block; width: 100%; height: auto; background: #FFFFFF; border: 1px solid #C7D2C4; border-radius: 3px; padding: 8px; box-sizing: border-box">
        <circle cx="160" cy="152" r="92" fill="#E2E8DE" stroke="#14201A" stroke-width="2"/>
        <circle cx="160" cy="152" r="58" fill="none" stroke="#14201A" stroke-width="2"/>
        <circle cx="160" cy="152" r="26" fill="rgba(44,107,69,.10)" stroke="#2C6B45" stroke-width="2.4"/>
        <line x1="330" y1="256" x2="176" y2="166" stroke="#2C6B45" stroke-width="2.4"/>
        <polygon points="178,164 162,152 172,172" fill="#2C6B45"/>
        <rect x="268" y="48" width="150" height="46" fill="none" stroke="#A9711B" stroke-width="2.4"/>
        <text x="343" y="77" text-anchor="middle" font-family="'Zen Kaku Gothic New', sans-serif" font-size="17" fill="#A9711B">◯月◯日までに</text>
      </svg>
      <figcaption style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #5A6A5E; line-height: 1.7">的と期限。どちらが欠けても、矢は放てない。</figcaption>
    </figure>

  </div>
</div>
</x-dc>
</body>
</html>
