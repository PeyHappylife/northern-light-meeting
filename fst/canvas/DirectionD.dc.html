<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #B45309; } a:hover { color: #8A3F06; }
  </style>
</helmet>
<div style="width: 1280px; height: 800px; background: #FFF7EC; color: #2A1D0C; font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; padding: 64px 88px; box-sizing: border-box; text-align: center">

  <span style="font-size: 20px; font-weight: 500; letter-spacing: 0.14em; color: #B45309; background: #FCE9CE; border-radius: 999px; padding: 10px 26px">STEP 1 ／ さいしょにやること</span>

  <h1 style="font-weight: 700; font-size: 64px; line-height: 1.3; margin: 0">目的を決める</h1>

  <div style="display: flex; align-items: center; gap: 48px">
    <svg viewBox="0 0 220 220" role="img" aria-label="的の中心に矢が届いた図" style="width: 200px; height: 200px; flex-shrink: 0">
      <circle cx="110" cy="110" r="92" fill="#FCE9CE"/>
      <circle cx="110" cy="110" r="60" fill="#F7D9A8"/>
      <circle cx="110" cy="110" r="28" fill="#D97706"/>
      <line x1="208" y1="204" x2="126" y2="126" stroke="#2A1D0C" stroke-width="7" stroke-linecap="round"/>
      <polygon points="128,124 104,110 118,134" fill="#2A1D0C"/>
    </svg>
    <p style="font-size: 32px; line-height: 1.7; font-weight: 700; margin: 0; text-align: left; word-break: keep-all">「なんのため？」を、<br>紙に<span style="color: #B45309">1行</span>で書く。</p>
  </div>

  <p style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 21px; line-height: 1.9; color: #5B4632; margin: 0; max-width: 26em">金額でも、時間でも、会いたい人の名前でもOK。<br><span style="font-weight: 500; color: #2A1D0C">「いつまでに」</span>を、となりに書いておきましょう。</p>

  <div style="display: flex; gap: 16px; align-items: center; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 17px; color: #8A6B47">
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #D97706"></span>
    <span>ファーストステップ・トレーニング　04 / 13</span>
  </div>
</div>
</x-dc>

</html>
